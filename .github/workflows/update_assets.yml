name: Plugin asset/readme update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trunk:
    name: Push to trunk
    runs-on: ubuntu-latest
    # Holds the SVN credentials; requires approval and only runs from main.
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: highlight-and-share
          IGNORE_OTHER_FILES: true